# Kantsoner: datakilder og kjøreinnstillinger.
#
# Her står bare hvor inndataene ligger og hvordan kjøringen settes opp.
# Metodekonstanter (koeffisienter, terskler, klassetabeller) er en del av
# spesifikasjonen og ligger i src/kantsoner/spec/constants.py. Mappestrukturen
# for resultatene per område bygges i src/kantsoner/config.py.
#
# Stiene er plassholdere; bytt dem ut med lokale mapper før kjøring:
#   <DATA> = lokal datamappe med inndatasettene
#   <OUT>  = utdatamappe for resultatene
# Filnavn, datoer og kjøreinnstillinger er de som ble brukt i den nasjonale
# kjøringen bak leveransen (2026-10-29 til 2026-11-09).
#
# Sjekk at alle kilder kan åpnes før en lang kjøring:  kantsoner config check

crs: EPSG:25833

paths:
  # Utdatamappe; én undermappe per område.
  base_dir: <OUT>

  # NVE Vassdragsområder (polygoner). Gir avgrensningen av hvert område.
  vassdragomr: <DATA>/vassdragomr/vassdragomr.gpkg

  # Kartverket/Høydedata (hoydedata.no), nasjonal 1 m terrengmodell (DTM) og
  # vegetasjonshøyde (CHM), fliser per 2026-09-11. Hull i DTM er fylt
  # (_filled). CHM: trehøyde og tredekning; DTM: helning og rutingen av elveløpet.
  chm: <DATA>/hoydedata/chm_norway_1m_epsg25833_20260911.tif
  dtm: <DATA>/hoydedata/dtm_norway_1m_epsg25833_20260911_filled.tif

  # Geonorge Grunnkart for arealanalyse (SSB/NIBIO), årsversjon 2025, nasjonal
  # FileGDB. Elve- og innsjøflater, arealdekke og bebygd areal.
  grunnkart_dir: <DATA>/grunnkart/Basisdata_0000_Norge_25833_GrunnkartArealanalyse_FGDB.gdb

  # NVE ELVIS elvenett, supplert med Vann-Nett-linjer (scripts/patch_elvis.py),
  # versjon 2026-11-06. Leveransens elvegeometri: 10 m-segmentene kuttes herfra.
  elvenett: <DATA>/elvenett/elvenett_vn_patched_20261106.gpkg

  # Kartverket/Geovekst FKB, én GeoPackage per kommune (EPSG:3044).
  # Bygning/BygnAnlegg: bygninger; Vann: bekker som linjer (run.include_creeks).
  fkb:
    bygning_dir: <DATA>/fkb/FKB-Bygning
    bygnanlegg_dir: <DATA>/fkb/FKB-BygnAnlegg
    vann_dir: <DATA>/fkb/FKB-Vann

  # NVE sikringstiltak (flom- og erosjonssikring, linjer og punkter) og
  # damlinjer/dampunkter. Gir Flomvern, Forbygning og vandringshindre.
  nve:
    flomsikring_line: <DATA>/nve/sikringstiltak_Flomsikring_line_nve.gpkg
    flomsikring_punkt: <DATA>/nve/sikringstiltak_Flomsikring_punkt_nve.gpkg
    erosjonssikring_line: <DATA>/nve/sikringstiltak_Erosjonssikring_line_nve.gpkg
    erosjonssikring_punkt: <DATA>/nve/sikringstiltak_Erosjonssikring_punkt_nve.gpkg
    dam_line: <DATA>/nve/damlinje_nve.gpkg
    dam_punkt: <DATA>/nve/dampunkt_nve.gpkg

  # Statens vegvesen, plastring/erosjonssikring. Telles i Forbygning sammen
  # med NVE.
  vegvesen: <DATA>/vegvesen/PlastringErosjonssikri_144.gpkg

  # Kildene under er valgfrie: mangler en, hoppes attributtene den gir over.

  # Field Geospatial, grøfter predikert fra RGB og DTM (2025-11-28). Må være
  # _pred_skeletonized-filen (har type = ditch/stream). Gir grøfteattributtene.
  grofter: <DATA>/grofter/20251128_rgb-dtm_grofter_pred_skeletonized.gpkg
  # Artsdatabanken, funn av fremmede arter langs vann (parkslirekne,
  # kjempespringfrø, vasspest), samlet av Field Geospatial (v01). Gir
  # fremmedart_risiko og K_S_d.
  fremmedart: <DATA>/fremmedart/Artsdatabanken_merged_v01.gpkg
  # Miljødirektoratet Vann-Nett, elvevannforekomster (linjer), Geonorge
  # 2026-10-26, konvertert med scripts/vannnett_from_geonorge.py. Gir
  # vannforekomstid til hvert segment.
  elvevannforekomster: <DATA>/vannnett/elvevannforekomster_20261026.gpkg
  # Miljødirektoratet Vann-Nett, innsjøvannforekomster, samme nedlasting.
  # Bestemmer hvilke innsjøer som leveres som innsjø (lake_*-lagene).
  # scripts/merge_delivery.py leser i tillegg hele nedlastingen som én fil
  # (vannforekomster_20261026.gpkg, FileGDB konvertert med ogr2ogr), så
  # leveransen får de samme ID-ene som kjøringen.
  vannforekomster: <DATA>/vannnett/innsjovannforekomster_20261026.gpkg
  # Kartverket NHM_ProsjektDekning, dekning per laserprosjekt. Gir
  # skanneåret til hvert segment (K_S_Laser_aar).
  nhm_prosjektdekning: <DATA>/nhm_prosjektdekning/NHM_ProsjektDekning.shp
  # Kartverket Administrative enheter (Geonorge), Norges yttergrense.
  # Klipper kantsoner ved riksgrensen; elvebredd i utlandet merkes Utenfor_Norge.
  landegrense: <DATA>/administrative/administrative-enheter-NORGE.gpkg

