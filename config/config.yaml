# Innstillingene under er de som ble brukt i den nasjonale kjøringen.
# include_creeks og batch_segments påvirker resultatet; de andre styrer bare
# rekkefølge og minnebruk.
run:
  # Ta med småbekker som FKB-Vann har som linjer, men grunnkart ikke som
  # flater (~75 % av nettet).
  include_creeks: true
  # Antall områder som kjøres samtidig, én prosess per område. Geometristeget
  # deler maskinens kjerner på dette tallet, også når bare ett område kjører.
  # Glomma kjøres først alene med -w 4 (ca. 53 timer, opptil 84 GB minne):
  #   kantsoner run -w 4 -r "Glommavassdraget/Hvaler og Singlefjorden"
  # deretter de øvrige 261 områdene med 12 samtidig.
  workers: 12
  # Segmenter per beregningsbolk (hele strekninger). Hver bolk leser sine
  # egne data og knytter dammer til sine egne segmenter, så bolkinndelingen
  # er en del av resultatet, ikke bare en minnegrense.
  batch_segments: 50000
  # Et nytt område (eller steg, med minneramme) startes bare når minst så
  # mye minne (GB) er ledig.
  min_free_gb: 25
  # Felles minneramme (GB) for alle steg som kjører samtidig; 0 = av.
  mem_budget_gb: 100
